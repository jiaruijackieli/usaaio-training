<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>USAAIO Training — Course</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏅</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.10/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js"></script>
<link id="hljs-light" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github.min.css">
<link id="hljs-dark" rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/styles/github-dark.min.css" disabled>
<style>
/* ============================ Design tokens ============================ */
:root {
  --bg: #f7f8fc; --surface: #ffffff; --surface-2: #f1f3f9;
  --fg: #171923; --fg-soft: #4a5164; --muted: #8189a0;
  --border: #e4e7f0; --border-strong: #d2d7e4;
  --brand: #5b5bd6; --brand-2: #8b5cf6; --brand-soft: #eeeefc;
  --grad: linear-gradient(120deg, #5b5bd6, #8b5cf6 55%, #c084fc);
  --gold: #f5b301; --gold-soft: #fdf3d4;
  --green: #16a34a; --green-soft: #e5f6ec;
  --code-bg: #f4f5fa; --out-bg: #fafbfe;
  --shadow: 0 1px 2px rgba(23,25,35,.05), 0 8px 24px -12px rgba(23,25,35,.12);
  --shadow-lg: 0 2px 4px rgba(23,25,35,.06), 0 18px 44px -14px rgba(23,25,35,.22);
  --radius: 16px;
}
[data-theme="dark"] {
  --bg: #0d0f17; --surface: #151827; --surface-2: #1b1f31;
  --fg: #eceef6; --fg-soft: #b6bccf; --muted: #7d859d;
  --border: #262b40; --border-strong: #333a55;
  --brand: #8385f0; --brand-2: #a78bfa; --brand-soft: #23264a;
  --gold: #f5b301; --gold-soft: #3a2f10;
  --green: #34d399; --green-soft: #11311f;
  --code-bg: #10131f; --out-bg: #121525;
  --shadow: 0 1px 2px rgba(0,0,0,.4), 0 8px 24px -12px rgba(0,0,0,.5);
  --shadow-lg: 0 2px 4px rgba(0,0,0,.4), 0 18px 44px -14px rgba(0,0,0,.6);
}
* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--fg);
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  font-size: 15.5px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
a { color: var(--brand); text-decoration: none; }
button { font-family: inherit; }

/* ============================ Top nav ============================ */
#topnav {
  position: sticky; top: 0; z-index: 50;
  background: color-mix(in srgb, var(--surface) 86%, transparent);
  backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px);
  border-bottom: 1px solid var(--border);
}
#topnav .inner {
  max-width: 1180px; margin: 0 auto; padding: 0 24px;
  display: flex; align-items: center; gap: 26px; height: 62px;
}
.brand { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 16.5px; color: var(--fg); letter-spacing: -.02em; }
.navlinks { display: flex; gap: 4px; flex: 1; }
.navlinks a {
  padding: 7px 13px; border-radius: 9px; color: var(--fg-soft);
  font-weight: 600; font-size: 14px;
}
.navlinks a:hover { background: var(--surface-2); color: var(--fg); }
.navlinks a.active { background: var(--brand-soft); color: var(--brand); }
#nav-search {
  display: flex; align-items: center; gap: 8px; border: 1px solid var(--border);
  background: var(--surface-2); color: var(--muted); border-radius: 10px;
  padding: 7px 12px; font-size: 13.5px; cursor: pointer; min-width: 190px;
}
#nav-search:hover { border-color: var(--border-strong); }
#nav-search kbd {
  margin-left: auto; font-family: inherit; font-size: 11px; border: 1px solid var(--border-strong);
  border-radius: 5px; padding: 0 5px; background: var(--surface);
}
#theme-toggle {
  border: 1px solid var(--border); background: var(--surface-2); color: var(--fg);
  width: 36px; height: 36px; border-radius: 10px; cursor: pointer; font-size: 15px;
}
#theme-toggle:hover { border-color: var(--border-strong); }

/* ============================ Page shell ============================ */
#app { min-height: calc(100vh - 62px); }
.page { max-width: 1180px; margin: 0 auto; padding: 36px 24px 90px; }
.crumbs { font-size: 13px; color: var(--muted); margin-bottom: 18px; display: flex; gap: 7px; flex-wrap: wrap; }
.crumbs a { color: var(--muted); font-weight: 500; }
.crumbs a:hover { color: var(--brand); }
.crumbs .sep { opacity: .5; }
.crumbs .here { color: var(--fg-soft); font-weight: 600; }

/* ============================ Hero ============================ */
.hero {
  position: relative; overflow: hidden; border-radius: 24px; padding: 58px 54px;
  background: var(--grad); color: #fff; box-shadow: var(--shadow-lg);
}
.hero::after {
  content: ""; position: absolute; inset: 0;
  background: radial-gradient(700px 320px at 85% -10%, rgba(255,255,255,.28), transparent 60%),
              radial-gradient(500px 300px at -5% 110%, rgba(255,255,255,.14), transparent 55%);
  pointer-events: none;
}
.hero > * { position: relative; z-index: 1; }
.hero h1 { font-size: clamp(30px, 4.6vw, 46px); margin: 0 0 12px; font-weight: 900; letter-spacing: -.03em; line-height: 1.1; }
.hero p.lead { max-width: 640px; margin: 0 0 26px; font-size: 16.5px; opacity: .93; }
.hero .cta-row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.btn {
  display: inline-flex; align-items: center; gap: 8px; border-radius: 12px;
  padding: 11px 20px; font-weight: 700; font-size: 14.5px; cursor: pointer;
  border: 1px solid transparent; transition: transform .12s, box-shadow .12s;
}
.btn:hover { transform: translateY(-1px); }
.btn-white { background: #fff; color: #4338ca; box-shadow: 0 6px 18px -6px rgba(0,0,0,.35); }
.btn-ghost { background: rgba(255,255,255,.13); color: #fff; border-color: rgba(255,255,255,.4); }
.btn-brand { background: var(--brand); color: #fff; box-shadow: var(--shadow); }
.btn-outline { background: var(--surface); color: var(--fg); border-color: var(--border-strong); }
.btn-green { background: var(--green); color: #fff; }
.hero .stats { display: flex; gap: 34px; flex-wrap: wrap; margin-top: 34px; }
.hero .stat .n { font-size: 27px; font-weight: 900; letter-spacing: -.02em; }
.hero .stat .l { font-size: 12.5px; opacity: .85; font-weight: 600; letter-spacing: .04em; text-transform: uppercase; }

/* ============================ Sections & cards ============================ */
.section { margin-top: 52px; }
.section-head { display: flex; align-items: baseline; gap: 14px; margin-bottom: 20px; }
.section-head h2 { font-size: 22px; font-weight: 800; letter-spacing: -.02em; margin: 0; }
.section-head .hint { color: var(--muted); font-size: 13.5px; }
.track-label {
  display: flex; align-items: center; gap: 10px; margin: 34px 0 14px;
  font-size: 13px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted);
}
.track-label::after { content: ""; height: 1px; flex: 1; background: var(--border); }
.grid { display: grid; gap: 18px; }
.grid.cols-3 { grid-template-columns: repeat(3, 1fr); }
.grid.cols-4 { grid-template-columns: repeat(4, 1fr); }
@media (max-width: 980px) { .grid.cols-3, .grid.cols-4 { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 620px) { .grid.cols-3, .grid.cols-4 { grid-template-columns: 1fr; } }

.card {
  background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
  padding: 22px; box-shadow: var(--shadow); color: var(--fg); display: block;
  transition: transform .14s, box-shadow .14s, border-color .14s;
}
a.card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); border-color: var(--border-strong); }
.unit-card .top { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.unit-card .icon {
  width: 44px; height: 44px; border-radius: 12px; background: var(--brand-soft);
  display: grid; place-items: center; font-size: 22px; flex-shrink: 0;
}
.unit-card .k { font-size: 11px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.unit-card h3 { margin: 1px 0 0; font-size: 16.5px; font-weight: 700; letter-spacing: -.01em; }
.unit-card p { margin: 0 0 14px; color: var(--fg-soft); font-size: 13.5px; line-height: 1.55; min-height: 42px; }
.unit-card .meta { display: flex; gap: 12px; color: var(--muted); font-size: 12.5px; font-weight: 600; margin-bottom: 12px; flex-wrap: wrap; }
.round-pill {
  font-size: 10.5px; font-weight: 800; letter-spacing: .06em; border-radius: 999px; padding: 3px 9px;
  margin-left: auto; flex-shrink: 0;
}
.round-1 { background: var(--green-soft); color: var(--green); }
.round-2 { background: var(--gold-soft); color: #b45309; }
[data-theme="dark"] .round-2 { color: var(--gold); }

.bar { height: 7px; border-radius: 99px; background: var(--surface-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: 99px; background: var(--grad); transition: width .3s; }
.bar-row { display: flex; align-items: center; gap: 10px; }
.bar-row .bar { flex: 1; }
.bar-row .pct { font-size: 12px; font-weight: 700; color: var(--muted); min-width: 34px; text-align: right; }

.quick-card { display: flex; gap: 14px; align-items: flex-start; }
.quick-card .icon { font-size: 26px; }
.quick-card h3 { margin: 0 0 3px; font-size: 15.5px; }
.quick-card p { margin: 0; color: var(--fg-soft); font-size: 13px; }

/* ============================ Unit page ============================ */
.unit-hero {
  display: flex; gap: 22px; align-items: flex-start;
  background: var(--surface); border: 1px solid var(--border); border-radius: 22px;
  padding: 32px; box-shadow: var(--shadow);
}
.unit-hero .icon {
  width: 74px; height: 74px; border-radius: 20px; background: var(--brand-soft);
  display: grid; place-items: center; font-size: 38px; flex-shrink: 0;
}
.unit-hero .k { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--brand); text-transform: uppercase; }
.unit-hero h1 { margin: 2px 0 8px; font-size: clamp(23px, 3.4vw, 32px); font-weight: 850; letter-spacing: -.02em; }
.unit-hero p { margin: 0 0 16px; color: var(--fg-soft); max-width: 640px; }
.unit-hero .chips { display: flex; gap: 10px; flex-wrap: wrap; }
.chip {
  display: inline-flex; align-items: center; gap: 7px; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border-strong); border-radius: 10px; padding: 7px 13px; color: var(--fg);
  background: var(--surface-2);
}
.chip:hover { border-color: var(--brand); color: var(--brand); }
.unit-progress-box { margin-left: auto; text-align: center; flex-shrink: 0; }

.lesson-list { display: flex; flex-direction: column; gap: 9px; }
.lesson-row {
  display: flex; align-items: center; gap: 15px; background: var(--surface);
  border: 1px solid var(--border); border-radius: 14px; padding: 13px 18px; color: var(--fg);
  transition: transform .12s, box-shadow .12s, border-color .12s;
}
.lesson-row:hover { transform: translateX(3px); border-color: var(--border-strong); box-shadow: var(--shadow); }
.lesson-row .no {
  width: 34px; height: 34px; border-radius: 10px; background: var(--surface-2); color: var(--fg-soft);
  display: grid; place-items: center; font-weight: 800; font-size: 13px; flex-shrink: 0;
}
.lesson-row.is-done .no { background: var(--green-soft); color: var(--green); }
.lesson-row .t { font-weight: 650; font-size: 14.5px; }
.lesson-row .sub { font-size: 12px; color: var(--muted); margin-top: 1px; }
.lesson-row .right { margin-left: auto; display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; }
.lesson-row .tick { color: var(--green); font-weight: 800; }
.lesson-row .arrow { color: var(--muted); transition: transform .12s; }
.lesson-row:hover .arrow { transform: translateX(3px); color: var(--brand); }

/* ============================ Learn (lesson) page ============================ */
.learn-grid { display: grid; grid-template-columns: 285px minmax(0, 1fr); gap: 34px; }
@media (max-width: 940px) { .learn-grid { grid-template-columns: 1fr; } .outline { position: static !important; max-height: none !important; } }
.outline {
  position: sticky; top: 82px; align-self: start; max-height: calc(100vh - 100px);
  overflow-y: auto; padding-right: 6px; scrollbar-width: thin;
}
.outline .unit-mini { display: flex; gap: 10px; align-items: center; margin-bottom: 14px; }
.outline .unit-mini .icon { width: 38px; height: 38px; font-size: 19px; border-radius: 11px; background: var(--brand-soft); display: grid; place-items: center; flex-shrink: 0; }
.outline .unit-mini .k { font-size: 10.5px; font-weight: 800; letter-spacing: .1em; color: var(--muted); text-transform: uppercase; }
.outline .unit-mini .t { font-weight: 750; font-size: 14px; line-height: 1.25; }
.outline .group { margin: 16px 0 6px; font-size: 11px; font-weight: 800; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); }
.outline a.item {
  display: flex; align-items: center; gap: 9px; padding: 6.5px 10px; border-radius: 9px;
  color: var(--fg-soft); font-size: 13.5px; font-weight: 550;
}
.outline a.item:hover { background: var(--surface-2); color: var(--fg); }
.outline a.item.active { background: var(--brand-soft); color: var(--brand); font-weight: 700; }
.outline a.item .st { width: 17px; text-align: center; flex-shrink: 0; font-size: 11.5px; color: var(--muted); }
.outline a.item.done .st { color: var(--green); font-weight: 800; }
.outline a.item span.txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

.doc-card {
  background: var(--surface); border: 1px solid var(--border); border-radius: 20px;
  box-shadow: var(--shadow); padding: 40px 46px;
}
@media (max-width: 620px) { .doc-card { padding: 26px 20px; } }
.doc-head { margin-bottom: 6px; }
.doc-head .kicker { font-size: 12px; font-weight: 800; letter-spacing: .1em; color: var(--brand); text-transform: uppercase; }
.doc-foot {
  display: flex; align-items: center; gap: 12px; margin-top: 34px; padding-top: 22px;
  border-top: 1px solid var(--border); flex-wrap: wrap;
}
.doc-foot .spacer { flex: 1; }
.navbtn {
  display: inline-flex; flex-direction: column; gap: 2px; border: 1px solid var(--border-strong);
  border-radius: 12px; padding: 10px 16px; color: var(--fg); background: var(--surface);
  max-width: 260px; cursor: pointer;
}
.navbtn:hover { border-color: var(--brand); }
.navbtn .dir { font-size: 11px; font-weight: 700; color: var(--muted); text-transform: uppercase; letter-spacing: .07em; }
.navbtn .t { font-weight: 650; font-size: 13.5px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* ============================ Markdown content ============================ */
.md { line-height: 1.72; font-size: 15.5px; }
.md > :first-child { margin-top: 0; }
.md h1, .md h2, .md h3, .md h4 { line-height: 1.3; margin: 1.7em 0 .55em; letter-spacing: -.015em; font-weight: 750; }
.md h1 { font-size: 1.85em; }
.md h2 { font-size: 1.4em; border-bottom: 1px solid var(--border); padding-bottom: .3em; }
.md h3 { font-size: 1.15em; }
.md blockquote { margin: 0 0 1em; padding: 8px 18px; border-left: 4px solid var(--brand); color: var(--fg-soft); background: var(--surface-2); border-radius: 0 10px 10px 0; }
.md table { border-collapse: collapse; display: block; overflow-x: auto; margin: 1.1em 0; }
.md th, .md td { border: 1px solid var(--border); padding: 7px 13px; font-size: 14px; }
.md th { background: var(--surface-2); font-weight: 700; }
.md img { max-width: 100%; border-radius: 10px; border: 1px solid var(--border); }
.md code { background: var(--code-bg); border-radius: 6px; padding: .16em .42em; font-size: 86%; font-family: "JetBrains Mono", ui-monospace, Menlo, monospace; }
.md pre { background: var(--code-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px 17px; overflow-x: auto; line-height: 1.55; }
.md pre code { background: none; padding: 0; font-size: 13px; }
.md hr { border: none; border-top: 1px solid var(--border); margin: 2.2em 0; }
.md ul, .md ol { padding-left: 1.5em; }
.katex-display { overflow-x: auto; overflow-y: hidden; padding: 6px 0; }
.katex { font-size: 1.06em; }

/* ============================ Notebook ============================ */
.nb-cell { margin: 0 0 18px; }
.nb-code { border: 1px solid var(--border); border-radius: 12px; overflow: hidden; }
.nb-code .nb-in { display: flex; }
.nb-prompt {
  flex-shrink: 0; width: 62px; padding: 13px 8px 0 0; text-align: right;
  font-family: "JetBrains Mono", Menlo, monospace; font-size: 10.5px; color: var(--muted); user-select: none;
  background: var(--code-bg);
}
.nb-code pre { margin: 0; flex: 1; background: var(--code-bg); padding: 13px 15px 13px 4px; overflow-x: auto; line-height: 1.55; }
.nb-code pre code { font-size: 13px; font-family: "JetBrains Mono", Menlo, monospace; background: none; }
.nb-out { border-top: 1px solid var(--border); background: var(--out-bg); display: flex; }
.nb-out pre {
  margin: 0; flex: 1; padding: 11px 15px; overflow-x: auto; font-size: 12.5px;
  line-height: 1.5; font-family: "JetBrains Mono", Menlo, monospace; white-space: pre-wrap; word-break: break-word;
}
.nb-out.nb-err pre { color: #dc2626; }
[data-theme="dark"] .nb-out.nb-err pre { color: #ff7b72; }
.nb-out img { max-width: 100%; margin: 10px 15px; background: #fff; border-radius: 8px; }
.nb-out .nb-html { padding: 8px 15px; overflow-x: auto; flex: 1; font-size: 13px; }
.nb-out .nb-html table { border-collapse: collapse; }
.nb-out .nb-html th, .nb-out .nb-html td { border: 1px solid var(--border); padding: 4px 9px; font-size: 12.5px; }

/* ============================ Progress page ============================ */
.progress-hero { display: flex; gap: 30px; align-items: center; flex-wrap: wrap; }
.ring-wrap { position: relative; }
.ring-wrap svg { transform: rotate(-90deg); }
.ring-wrap .mid { position: absolute; inset: 0; display: grid; place-items: center; text-align: center; }
.ring-wrap .mid .n { font-size: 26px; font-weight: 900; letter-spacing: -.02em; }
.ring-wrap .mid .l { font-size: 10.5px; color: var(--muted); font-weight: 700; text-transform: uppercase; letter-spacing: .07em; }

/* ============================ Misc / search ============================ */
.placeholder { color: var(--muted); text-align: center; padding: 70px 0; }
.placeholder .big { font-size: 44px; margin-bottom: 10px; }
iframe.pdf { width: 100%; height: calc(100vh - 220px); border: 1px solid var(--border); border-radius: 12px; }
.csv-note { color: var(--muted); font-size: 12.5px; margin: 4px 0 12px; }
.tree details { margin: 2px 0; }
.tree summary { cursor: pointer; font-weight: 650; padding: 5px 8px; border-radius: 8px; font-size: 14px; }
.tree summary:hover { background: var(--surface-2); }
.tree .kids { margin-left: 16px; border-left: 1px solid var(--border); padding-left: 10px; }
.tree a { display: flex; gap: 8px; align-items: center; padding: 4px 8px; border-radius: 7px; color: var(--fg-soft); font-size: 13.5px; }
.tree a:hover { background: var(--surface-2); color: var(--fg); }
.ext-tag { font-size: 9.5px; font-weight: 700; color: var(--muted); background: var(--surface-2); border: 1px solid var(--border); border-radius: 5px; padding: 1px 5px; text-transform: uppercase; }

#search-overlay {
  position: fixed; inset: 0; z-index: 100; background: rgba(10,12,20,.45);
  display: none; align-items: flex-start; justify-content: center; padding: 90px 18px 18px;
  backdrop-filter: blur(3px);
}
#search-overlay.open { display: flex; }
#search-panel {
  width: 640px; max-width: 100%; background: var(--surface); border: 1px solid var(--border-strong);
  border-radius: 16px; box-shadow: var(--shadow-lg); overflow: hidden;
}
#search-input {
  width: 100%; border: none; outline: none; background: transparent; color: var(--fg);
  font-size: 16px; padding: 17px 20px; font-family: inherit; border-bottom: 1px solid var(--border);
}
#search-results { max-height: 55vh; overflow-y: auto; padding: 8px; }
#search-results a {
  display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 10px; color: var(--fg);
}
#search-results a:hover, #search-results a.sel { background: var(--brand-soft); }
#search-results .icon { font-size: 17px; width: 24px; text-align: center; }
#search-results .t { font-weight: 600; font-size: 14px; }
#search-results .c { font-size: 12px; color: var(--muted); }
#search-results .none { padding: 22px; text-align: center; color: var(--muted); font-size: 14px; }

footer.site {
  border-top: 1px solid var(--border); color: var(--muted); font-size: 13px;
  padding: 26px 24px 40px; text-align: center; margin-top: 30px;
}
footer.site a { color: var(--fg-soft); font-weight: 600; }
@media (max-width: 760px) {
  .navlinks { display: none; }
  #nav-search { min-width: 0; }

<script src="course-data.js"></script>
<script>
(function () {
"use strict";
const C = window.COURSE;
const app = document.getElementById("app");
const h = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ============================ State ============================ */
const doneSet = new Set(JSON.parse(localStorage.getItem("usaaio-done") || "[]"));
const saveDone = () => localStorage.setItem("usaaio-done", JSON.stringify([...doneSet]));
const getLast = () => { try { return JSON.parse(localStorage.getItem("usaaio-last")); } catch (e) { return null; } };
const setLast = v => localStorage.setItem("usaaio-last", JSON.stringify(v));

/* ============================ Theme ============================ */
const rootEl = document.documentElement;
function applyTheme(t) {
  rootEl.setAttribute("data-theme", t);
  document.getElementById("hljs-light").disabled = t === "dark";
  document.getElementById("hljs-dark").disabled = t !== "dark";
  localStorage.setItem("usaaio-theme", t);
}
applyTheme(localStorage.getItem("usaaio-theme") ||
  (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light"));
document.getElementById("theme-toggle").onclick = () =>
  applyTheme(rootEl.getAttribute("data-theme") === "dark" ? "light" : "dark");

/* ============================ Course helpers ============================ */
function unitItems(u) {
  const seq = [];
  if (u.readme) seq.push({ path: u.readme, title: "Unit Overview", group: "Overview", icon: "🏠" });
  if (u.cheatsheet) seq.push({ path: u.cheatsheet, title: "Cheat Sheet", group: "Overview", icon: "🗂️" });
  u.lessons.forEach(l => seq.push({ ...l, group: "Study Guide", icon: "📖" }));
  u.exercises.forEach(l => seq.push({ ...l, group: "Exercises", icon: "✏️" }));
  u.assignments.forEach(l => seq.push({ ...l, group: "Assignments", icon: "📓" }));
  return seq;
}
function trackables(u) { return [...u.lessons, ...u.exercises, ...u.assignments].map(x => x.path); }
function unitPct(u) {
  const t = trackables(u);
  if (!t.length) return 0;
  return Math.round(100 * t.filter(p => doneSet.has(p)).length / t.length);
}
function overallCounts() {
  let total = 0, done = 0;
  for (const u of C.units) { const t = trackables(u); total += t.length; done += t.filter(p => doneSet.has(p)).length; }
  return { total, done, pct: total ? Math.round(100 * done / total) : 0 };
}
function findUnit(path) { return C.units.find(u => path.startsWith(u.dir + "/")); }
function learnHref(path) { return "#/learn/" + encodeURI(path); }
function nextUp() {
  const last = getLast();
  if (last && last.path) return { label: "Continue: " + last.title, href: learnHref(last.path) };
  for (const u of C.units) for (const p of trackables(u)) if (!doneSet.has(p)) {
    const item = unitItems(u).find(i => i.path === p);
    return { label: "Start: Unit " + u.num + " · " + item.title, href: learnHref(p) };
  }
  return { label: "Start Unit 01", href: "#/unit/01" };
}

/* ============================ Markdown / math pipeline ============================ */
marked.setOptions({ mangle: false, headerIds: false });
const MO = "\uE000", MC = "\uE001", CO = "\uE002", CC = "\uE003";

function renderMarkdown(src, docDir) {
  const codeStash = [], mathStash = [];
  let txt = src
    .replace(/```[\s\S]*?```|~~~[\s\S]*?~~~/g, m => { codeStash.push(m); return CO + (codeStash.length - 1) + CC; })
    .replace(/`[^`\n]+`/g, m => { codeStash.push(m); return CO + (codeStash.length - 1) + CC; });
  const keepMath = (tex, display) => { mathStash.push({ tex, display }); return MO + (mathStash.length - 1) + MC; };
  txt = txt
    .replace(/\$\$([\s\S]+?)\$\$/g, (_, t) => keepMath(t, true))
    .replace(/\\\[([\s\S]+?)\\\]/g, (_, t) => keepMath(t, true))
    .replace(/\\\((.+?)\\\)/g, (_, t) => keepMath(t, false))
    .replace(/\$(?!\s)((?:\\.|[^$\n])+?)(?<![\s\\])\$(?!\d)/g, (_, t) => keepMath(t, false));
  txt = txt.replace(new RegExp(CO + "(\\d+)" + CC, "g"), (_, i) => codeStash[+i]);
  const div = document.createElement("div");
  div.className = "md";
  div.innerHTML = marked.parse(txt);
  renderMathIn(div, mathStash);
  highlightIn(div);
  fixLinks(div, docDir);
  return div;
}

function renderMathIn(el, mathStash) {
  const rx = new RegExp(MO + "(\\d+)" + MC);
  walkText(el, node => {
    let rest = node.nodeValue;
    if (rest.indexOf(MO) === -1) return;
    const frag = document.createDocumentFragment();
    let m;
    while ((m = rx.exec(rest))) {
      frag.appendChild(document.createTextNode(rest.slice(0, m.index)));
      const entry = mathStash[+m[1]];
      if (entry) {
        const span = document.createElement(entry.display ? "div" : "span");
        try { katex.render(entry.tex, span, { displayMode: entry.display, throwOnError: false }); }
        catch (e) { span.textContent = entry.tex; }
        frag.appendChild(span);
      }
      rest = rest.slice(m.index + m[0].length);
    }
    frag.appendChild(document.createTextNode(rest));
    node.parentNode.replaceChild(frag, node);
  });
}

function walkText(el, fn) {
  const skip = { SCRIPT: 1, STYLE: 1, CODE: 1, PRE: 1, TEXTAREA: 1 };
  const nodes = [];
  (function rec(n) {
    for (let c = n.firstChild; c; c = c.nextSibling) {
      if (c.nodeType === 3) nodes.push(c);
      else if (c.nodeType === 1 && !skip[c.nodeName] && !c.classList.contains("katex")) rec(c);
    }
  })(el);
  nodes.forEach(fn);
}

function highlightIn(el) {
  el.querySelectorAll("pre code").forEach(b => { try { hljs.highlightElement(b); } catch (e) {} });
}

function resolvePath(docDir, rel) {
  const url = new URL(rel, "http://x/" + docDir + "/");
  return decodeURIComponent(url.pathname.replace(/^\//, ""));
}
function fixLinks(el, docDir) {
  el.querySelectorAll("img").forEach(img => {
    const src = img.getAttribute("src") || "";
    if (!/^(https?:|data:)/.test(src)) img.src = encodeURI(resolvePath(docDir, src));
  });
  el.querySelectorAll("a").forEach(a => {
    const href = a.getAttribute("href") || "";
    if (/^(https?:|mailto:)/.test(href)) { a.target = "_blank"; a.rel = "noopener"; return; }
    if (href.startsWith("#")) return;
    const target = resolvePath(docDir, href.split("#")[0]);
    if (/\.(md|ipynb|pdf|py|txt|csv|toml)$/i.test(target)) a.href = learnHref(target);
    else a.href = encodeURI(target);
  });
}

/* ============================ Notebook rendering ============================ */
function renderNotebook(nb, docDir) {
  const wrap = document.createElement("div");
  for (const cell of nb.cells || []) {
    const srcText = Array.isArray(cell.source) ? cell.source.join("") : (cell.source || "");
    if (cell.cell_type === "markdown") {
      const md = renderMarkdown(srcText, docDir);
      md.classList.add("nb-cell");
      wrap.appendChild(md);
    } else if (cell.cell_type === "code") {
      const div = document.createElement("div");
      div.className = "nb-cell nb-code";
      const inRow = document.createElement("div");
      inRow.className = "nb-in";
      const prompt = document.createElement("div");
      prompt.className = "nb-prompt";
      prompt.textContent = "In [" + (cell.execution_count ?? " ") + "]";
      const pre = document.createElement("pre");
      const code = document.createElement("code");
      code.className = "language-python";
      code.textContent = srcText;
      pre.appendChild(code);
      inRow.appendChild(prompt); inRow.appendChild(pre);
      div.appendChild(inRow);
      try { hljs.highlightElement(code); } catch (e) {}
      for (const out of cell.outputs || []) div.appendChild(renderOutput(out));
      wrap.appendChild(div);
    }
  }
  return wrap;
}
function renderOutput(out) {
  const div = document.createElement("div");
  div.className = "nb-out";
  const data = out.data || {};
  const join = v => Array.isArray(v) ? v.join("") : (v || "");
  if (out.output_type === "stream") {
    const pre = document.createElement("pre");
    pre.textContent = join(out.text);
    if (out.name === "stderr") div.classList.add("nb-err");
    div.appendChild(pre);
  } else if (out.output_type === "error") {
    div.classList.add("nb-err");
    const pre = document.createElement("pre");
    pre.textContent = (out.traceback || []).join("\n").replace(/\x1b\[[0-9;]*m/g, "");
    div.appendChild(pre);
  } else if (data["image/png"]) {
    const img = document.createElement("img");
    img.src = "data:image/png;base64," + join(data["image/png"]).replace(/\n/g, "");
    div.appendChild(img);
  } else if (data["text/html"]) {
    const el = document.createElement("div");
    el.className = "nb-html";
    el.innerHTML = join(data["text/html"]);
    div.appendChild(el);
  } else if (data["text/plain"]) {
    const pre = document.createElement("pre");
    pre.textContent = join(data["text/plain"]);
    div.appendChild(pre);
  } else return document.createDocumentFragment();
  return div;
}

function renderCsv(text) {
  const wrap = document.createElement("div");
  wrap.className = "md";
  const rows = text.trim().split(/\r?\n/).map(r => r.split(","));
  const LIMIT = 200;
  if (rows.length > LIMIT + 1) {
    const note = document.createElement("div");
    note.className = "csv-note";
    note.textContent = "Showing first " + LIMIT + " of " + (rows.length - 1) + " rows";
    wrap.appendChild(note);
  }
  const table = document.createElement("table");
  rows.slice(0, LIMIT + 1).forEach((cols, i) => {
    const tr = document.createElement("tr");
    cols.forEach(c => {
      const cell = document.createElement(i === 0 ? "th" : "td");
      cell.textContent = c;
      tr.appendChild(cell);
    });
    table.appendChild(tr);
  });
  wrap.appendChild(table);
  return wrap;
}

/* ============================ Shared UI bits ============================ */
const barHTML = pct => '<div class="bar-row"><div class="bar"><i style="width:' + pct + '%"></i></div><span class="pct">' + pct + '%</span></div>';
function ringHTML(pct, size, label) {
  const r = (size - 12) / 2, c = 2 * Math.PI * r;
  return `<div class="ring-wrap" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}">
      <defs><linearGradient id="ringgrad" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#5b5bd6"/><stop offset="1" stop-color="#c084fc"/>
      </linearGradient></defs>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="11"/>
      <circle cx="${size / 2}" cy="${size / 2}" r="${r}" fill="none" stroke="url(#ringgrad)" stroke-width="11"
        stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${c * (1 - pct / 100)}"/>
    </svg>
    <div class="mid"><div><div class="n">${pct}%</div><div class="l">${label}</div></div></div>
  </div>`;
}
function crumbsHTML(parts) {
  return '<div class="crumbs">' + parts.map((p, i) =>
    i === parts.length - 1
      ? '<span class="here">' + h(p.label) + "</span>"
      : '<a href="' + p.href + '">' + h(p.label) + '</a><span class="sep">/</span>'
  ).join("") + "</div>";
}
function setNav(name) {
  document.querySelectorAll("[data-nav]").forEach(a =>
    a.classList.toggle("active", a.dataset.nav === name));
}

/* ============================ Pages ============================ */
function pageHome() {
  setNav("home");
  const { total, done, pct } = overallCounts();
  const cont = nextUp();
  const nLessons = C.units.reduce((n, u) => n + u.lessons.length, 0);
  const nAssign = C.units.reduce((n, u) => n + u.assignments.length, 0);
  const nEx = C.units.reduce((n, u) => n + u.exercises.length, 0);

  let unitsHTML = "";
  for (const track of C.tracks) {
    const units = C.units.filter(u => u.track === track);
    if (!units.length) continue;
    unitsHTML += `<div class="track-label">${h(track)}</div><div class="grid cols-3">` +
      units.map(u => `
        <a class="card unit-card" href="#/unit/${u.slug}">
          <div class="top">
            <div class="icon">${u.icon}</div>
            <div><div class="k">Unit ${u.num}</div><h3>${h(u.title)}</h3></div>
            <span class="round-pill round-${u.round}">R${u.round}</span>
          </div>
          <p>${h(u.desc)}</p>
          <div class="meta">
            <span>📖 ${u.lessons.length} lessons</span>
            <span>✏️ ${u.exercises.length}</span>
            <span>📓 ${u.assignments.length}</span>
          </div>
          ${barHTML(unitPct(u))}
        </a>`).join("") + `</div>`;
  }

  app.innerHTML = `<div class="page">
    <section class="hero">
      <h1>USA AI Olympiad<br>Training Course</h1>
      <p class="lead">A complete 12-unit curriculum for the USAAIO — from mathematical foundations
      through Transformers, generative AI, and graph neural networks. Theory derived by hand,
      then implemented from scratch in Python and PyTorch.</p>
      <div class="cta-row">
        <a class="btn btn-white" href="${cont.href}">${h(cont.label)} →</a>
        <a class="btn btn-ghost" href="#/practice">Practice problems</a>
      </div>
      <div class="stats">
        <div class="stat"><div class="n">12</div><div class="l">Units</div></div>
        <div class="stat"><div class="n">${nLessons}</div><div class="l">Lessons</div></div>
        <div class="stat"><div class="n">${nEx}</div><div class="l">Exercise sets</div></div>
        <div class="stat"><div class="n">${nAssign}</div><div class="l">Assignments</div></div>
        <div class="stat"><div class="n">${pct}%</div><div class="l">Complete</div></div>
      </div>
    </section>

    <section class="section">
      <div class="section-head">
        <h2>Curriculum</h2>
        <span class="hint">Round 1 covers Units 01–07 · Round 2 covers all twelve</span>
      </div>
      ${unitsHTML}
    </section>

    <section class="section">
      <div class="section-head"><h2>Beyond the units</h2></div>
      <div class="grid cols-4">
        <a class="card quick-card" href="#/practice"><span class="icon">🧩</span>
          <div><h3>Practice Problems</h3><p>${C.practice.problems.length} Round 1 variation sets in Markdown & notebook form.</p></div></a>
        <a class="card quick-card" href="${learnHref(C.round2prep)}"><span class="icon">🎯</span>
          <div><h3>Round 2 Prep</h3><p>Gap analysis, tiered study plan, and key formulas for MIT.</p></div></a>
        <a class="card quick-card" href="#/resources"><span class="icon">📜</span>
          <div><h3>Official Materials</h3><p>Real past problems, solutions, templates, and syllabi.</p></div></a>
        <a class="card quick-card" href="#/progress"><span class="icon">📊</span>
          <div><h3>My Progress</h3><p>${done} of ${total} items complete — track every unit.</p></div></a>
      </div>
    </section>
  </div>`;
}

function pageUnit(slug) {
  setNav(null);
  const u = C.units.find(x => x.slug === slug);
  if (!u) return page404();
  const pct = unitPct(u);
  const idx = C.units.indexOf(u);
  const prevU = C.units[idx - 1], nextU = C.units[idx + 1];

  const row = (item, icon, subtitle) => {
    const isDone = doneSet.has(item.path);
    return `<a class="lesson-row ${isDone ? "is-done" : ""}" href="${learnHref(item.path)}">
      <div class="no">${isDone ? "✓" : h(item.num ?? icon)}</div>
      <div><div class="t">${h(item.title)}</div>${subtitle ? `<div class="sub">${h(subtitle)}</div>` : ""}</div>
      <div class="right">
        ${item.minutes ? `<span>${item.minutes} min</span>` : ""}
        ${isDone ? `<span class="tick">Done</span>` : ""}
        <span class="arrow">→</span>
      </div>
    </a>`;
  };

  app.innerHTML = `<div class="page">
    ${crumbsHTML([{ label: "Home", href: "#/" }, { label: "Unit " + u.num }])}
    <section class="unit-hero">
      <div class="icon">${u.icon}</div>
      <div style="flex:1">
        <div class="k">Unit ${u.num} · ${h(u.track)} · Round ${u.round}</div>
        <h1>${h(u.title)}</h1>
        <p>${h(u.desc)}</p>
        <div class="chips">
          ${u.readme ? `<a class="chip" href="${learnHref(u.readme)}">🏠 Unit overview</a>` : ""}
          ${u.cheatsheet ? `<a class="chip" href="${learnHref(u.cheatsheet)}">🗂️ Cheat sheet</a>` : ""}
        </div>
      </div>
      <div class="unit-progress-box">${ringHTML(pct, 120, "complete")}</div>
    </section>

    ${u.lessons.length ? `<section class="section">
      <div class="section-head"><h2>📖 Study Guide</h2><span class="hint">${u.lessons.length} lessons</span></div>
      <div class="lesson-list">${u.lessons.map(l => row(l, "📖")).join("")}</div>
    </section>` : ""}

    ${u.exercises.length ? `<section class="section">
      <div class="section-head"><h2>✏️ Exercises</h2><span class="hint">${u.exercises.length} problem sets</span></div>
      <div class="lesson-list">${u.exercises.map(l => row(l, "✏️")).join("")}</div>
    </section>` : ""}

    ${u.assignments.length ? `<section class="section">
      <div class="section-head"><h2>📓 Assignments</h2><span class="hint">${u.assignments.length} Jupyter notebooks</span></div>
      <div class="lesson-list">${u.assignments.map(l => row(l, "📓", "Jupyter notebook")).join("")}</div>
    </section>` : ""}

    <div class="doc-foot" style="border:none;margin-top:40px">
      ${prevU ? `<a class="navbtn" href="#/unit/${prevU.slug}"><span class="dir">← Previous unit</span><span class="t">${prevU.icon} ${h(prevU.title)}</span></a>` : ""}
      <div class="spacer"></div>
      ${nextU ? `<a class="navbtn" style="text-align:right" href="#/unit/${nextU.slug}"><span class="dir">Next unit →</span><span class="t">${nextU.icon} ${h(nextU.title)}</span></a>` : ""}
    </div>
  </div>`;
}

/* ---------- Learn / document reader ---------- */
async function pageLearn(path) {
  setNav(null);
  const u = findUnit(path);
  const seq = u ? unitItems(u) : null;
  const item = seq ? seq.find(i => i.path === path) : null;
  const pos = seq ? seq.findIndex(i => i.path === path) : -1;
  const prev = pos > 0 ? seq[pos - 1] : null;
  const next = pos >= 0 && pos < seq.length - 1 ? seq[pos + 1] : null;
  const title = item ? item.title : decodeURI(path.split("/").pop());
  const trackable = !!(item && item.group !== "Overview");
  const area = areaOf(path);

  document.title = title + " — USAAIO Training";
  setLast({ path, title: (u ? "Unit " + u.num + " · " : "") + title });

  const outlineHTML = u ? `<aside class="outline">
    <a class="unit-mini" href="#/unit/${u.slug}" style="color:inherit">
      <span class="icon">${u.icon}</span>
      <span><span class="k">Unit ${u.num}</span><br><span class="t">${h(u.title)}</span></span>
    </a>
    ${barHTML(unitPct(u))}
    ${(() => {
      let html = "", lastGroup = null;
      for (const it of seq) {
        if (it.group !== lastGroup) { html += `<div class="group">${h(it.group)}</div>`; lastGroup = it.group; }
        const isDone = doneSet.has(it.path);
        const active = it.path === path;
        html += `<a class="item ${active ? "active" : ""} ${isDone ? "done" : ""}" href="${learnHref(it.path)}">
          <span class="st">${isDone ? "✓" : (it.num ?? "·")}</span><span class="txt">${h(it.title)}</span></a>`;
      }
      return html;
    })()}
  </aside>` : "";

  const crumbParts = u
    ? [{ label: "Home", href: "#/" }, { label: "Unit " + u.num + " — " + u.title, href: "#/unit/" + u.slug }, { label: title }]
    : [{ label: "Home", href: "#/" }, ...(area ? [{ label: area.label, href: area.href }] : []), { label: title }];

  app.innerHTML = `<div class="page">
    ${crumbsHTML(crumbParts)}
    <div class="${u ? "learn-grid" : ""}">
      ${outlineHTML}
      <div style="min-width:0">
        <div class="doc-card">
          ${item ? `<div class="doc-head"><div class="kicker">${h(item.group)}${item.minutes ? " · " + item.minutes + " min read" : ""}</div></div>` : ""}
          <div id="doc-body"><div class="placeholder">Loading…</div></div>
          <div class="doc-foot">
            ${prev ? `<a class="navbtn" href="${learnHref(prev.path)}"><span class="dir">← Previous</span><span class="t">${h(prev.title)}</span></a>` : ""}
            <div class="spacer"></div>
            ${trackable ? `<button class="btn ${doneSet.has(path) ? "btn-outline" : "btn-green"}" id="mark-done">
              ${doneSet.has(path) ? "✓ Completed — undo" : "✓ Mark complete"}</button>` : ""}
            ${next ? `<a class="navbtn" style="text-align:right" href="${learnHref(next.path)}"><span class="dir">Next →</span><span class="t">${h(next.title)}</span></a>` : ""}
          </div>
        </div>
      </div>
    </div>
  </div>`;

  const markBtn = document.getElementById("mark-done");
  if (markBtn) markBtn.onclick = () => {
    if (doneSet.has(path)) doneSet.delete(path); else doneSet.add(path);
    saveDone();
    pageLearn(path);
  };

  const body = document.getElementById("doc-body");
  const ext = path.split(".").pop().toLowerCase();
  const docDir = path.includes("/") ? path.slice(0, path.lastIndexOf("/")) : "";
  try {
    if (ext === "pdf") {
      body.innerHTML = `<iframe class="pdf" src="${encodeURI(path)}"></iframe>`;
      return;
    }
    const res = await fetch(encodeURI(path));
    if (!res.ok) throw new Error(res.status + " " + res.statusText);
    body.innerHTML = "";
    if (ext === "ipynb") body.appendChild(renderNotebook(await res.json(), docDir));
    else if (ext === "md") body.appendChild(renderMarkdown(await res.text(), docDir));
    else if (ext === "csv") body.appendChild(renderCsv(await res.text()));
    else {
      const pre = document.createElement("pre");
      pre.className = "md";
      pre.style.cssText = "background:var(--code-bg);border:1px solid var(--border);border-radius:12px;padding:15px 17px;overflow-x:auto";
      const code = document.createElement("code");
      code.className = ext === "py" ? "language-python" : "";
      code.textContent = await res.text();
      pre.appendChild(code);
      body.appendChild(pre);
      highlightIn(body);
    }
  } catch (err) {
    body.innerHTML = `<div class="placeholder"><div class="big">⚠️</div>
      Could not load <code>${h(path)}</code> — ${h(String(err.message || err))}<br>
      <span style="font-size:13px">Serve this folder over HTTP (e.g. <code>python3 -m http.server</code>).</span></div>`;
  }
}

function areaOf(path) {

  return null;
}

/* ============================ Search ============================ */
const searchIndex = [];
for (const u of C.units) {
  searchIndex.push({ icon: u.icon, t: "Unit " + u.num + " — " + u.title, c: u.track, href: "#/unit/" + u.slug });
  for (const it of unitItems(u))
    searchIndex.push({ icon: it.icon, t: it.title, c: "Unit " + u.num + " · " + it.group, href: learnHref(it.path) });
}
for (const p of C.practice.problems) {
  if (p.md) searchIndex.push({ icon: "🧩", t: "Problem " + p.num + (p.topic ? " — " + p.topic : ""), c: "Practice", href: learnHref(p.md) });
}
for (const n of C.archive) searchIndex.push({ icon: "📓", t: n.num + " · " + n.title, c: "2025 Archive", href: learnHref(n.path) });
(function flat(nodes, trail) {
  for (const n of nodes) {
    if (n.type === "dir") flat(n.children, trail + n.label + " / ");
    else searchIndex.push({ icon: "🏛️", t: n.label, c: "Official · " + trail.replace(/ \/ $/, ""), href: learnHref(n.path) });
  }
})(C.official, "");

const overlay = document.getElementById("search-overlay");
const sInput = document.getElementById("search-input");
const sResults = document.getElementById("search-results");
function openSearch() { overlay.classList.add("open"); sInput.value = ""; renderResults(""); sInput.focus(); }
function closeSearch() { overlay.classList.remove("open"); }
function renderResults(q) {
  q = q.trim().toLowerCase();
  const hits = q
    ? searchIndex.filter(x => (x.t + " " + x.c).toLowerCase().includes(q)).slice(0, 30)
    : searchIndex.slice(0, 12);
  sResults.innerHTML = hits.length
    ? hits.map((x, i) => `<a href="${x.href}" class="${i === 0 ? "sel" : ""}">
        <span class="icon">${x.icon}</span><span><div class="t">${h(x.t)}</div><div class="c">${h(x.c)}</div></span></a>`).join("")
    : `<div class="none">No matches for “${h(q)}”</div>`;
}
document.getElementById("nav-search").onclick = openSearch;
sInput.addEventListener("input", () => renderResults(sInput.value));
sInput.addEventListener("keydown", e => {
  if (e.key === "Enter") { const first = sResults.querySelector("a"); if (first) { location.hash = first.getAttribute("href").slice(1); closeSearch(); } }
  if (e.key === "Escape") closeSearch();
});
overlay.addEventListener("click", e => { if (e.target === overlay) closeSearch(); });
sResults.addEventListener("click", () => closeSearch());
document.addEventListener("keydown", e => {
  if (e.key === "/" && !overlay.classList.contains("open") &&
      !/^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName)) { e.preventDefault(); openSearch(); }
  if (e.key === "Escape") closeSearch();
});

/* ============================ Router ============================ */
function route() {
  const raw = decodeURI(location.hash.replace(/^#\/?/, ""));
  window.scrollTo(0, 0);
  if (!raw || raw === "home") { document.title = "USAAIO Training — Course"; return pageHome(); }
  if (raw === "practice") { document.title = "Practice — USAAIO Training"; return pagePractice(); }
  if (raw === "resources") { document.title = "Resources — USAAIO Training"; return pageResources(); }
  if (raw === "progress") { document.title = "My Progress — USAAIO Training"; return pageProgress(); }
  if (raw.startsWith("unit/")) { const u = C.units.find(x => x.slug === raw.slice(5)); document.title = u ? "Unit " + u.num + " — USAAIO Training" : "USAAIO Training"; return pageUnit(raw.slice(5)); }
  if (raw.startsWith("learn/")) return pageLearn(raw.slice(6));
  return page404();
}
addEventListener("hashchange", route);
route();
})();
